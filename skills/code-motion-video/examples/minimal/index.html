<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><script>
const PROJECT={w:1280,h:720,fps:30,duration:3,seed:7};
function rng(s){return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s>>>0)/4294967296))}
const ease=k=>1-Math.pow(1-Math.min(1,Math.max(0,k)),3);
const seg=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
const ctx=document.getElementById('c').getContext('2d');
window.renderFrame=function(t){const r=rng(PROJECT.seed);ctx.fillStyle='#14161c';ctx.fillRect(0,0,1280,720);
 for(let i=0;i<40;i++){ctx.fillStyle='#2a2f3a';ctx.fillRect(r()*1280,r()*720,3,3)}
 const x=200+ease(seg(t,0.4,1.2))*800; ctx.fillStyle='#d97757';ctx.beginPath();ctx.arc(x,360,60,0,7);ctx.fill();};
window.PROJECT=PROJECT; window.__ready=document.fonts.ready.then(()=>true);
</script></body></html>
