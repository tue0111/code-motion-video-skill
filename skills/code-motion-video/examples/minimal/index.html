<!doctype html>
<html><head><meta charset="utf-8"><title>one-shape morph</title>
<style>html,body{margin:0;background:#EDE9E0}canvas{display:block}</style>
<script src="../../lib/motion.js"></script></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Ví dụ "một hình không bao giờ cắt": nút → loader → dấu tích → thẻ số liệu → về nút (loop).
// 120 BPM, mỗi trạng thái đổi đúng phách; con trỏ lái mọi thay đổi. 6:3:1: nền ấm yên, lưới mờ, một màu nhấn.
const PROJECT = { w: 1080, h: 1080, fps: 30, duration: 6, bpm: 120 };
window.PROJECT = PROJECT;
const { spring, track, swapAlpha, clamp, seg, ease, loopT, kf, SPRING, frameT } = M;
const g = document.getElementById('c').getContext('2d');
const INK = '#1F1D1A', PAPER = '#EDE9E0', GRID = '#DDD7CA', ACCENT = '#D97757';
const B = 60 / PROJECT.bpm;                       // 0.5 s mỗi phách
// Trạng thái trên lưới phách: [time, w, h, radius]
const S = [[0, 360, 120, 60], [2 * B, 120, 120, 60], [5 * B, 120, 120, 60], [6 * B, 520, 300, 36], [10 * B, 520, 300, 36], [10.5 * B, 360, 120, 60]];
const keysOf = i => S.map(s => [s[0], s[i]]);
const [kd, dd] = SPRING.default;

function roundRect(x, y, w, h, r) { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, Math.min(r, w / 2, h / 2)); }

function seek(T) {
  const t = loopT(T, PROJECT.duration);
  g.fillStyle = PAPER; g.fillRect(0, 0, 1080, 1080);
  // 60%: lưới nền thở rất chậm, không tranh mắt
  g.strokeStyle = GRID; g.lineWidth = 1;
  const drift = 6 * Math.sin(t / PROJECT.duration * 2 * Math.PI);
  for (let x = 60; x < 1080; x += 80) { g.beginPath(); g.moveTo(x + drift, 0); g.lineTo(x + drift, 1080); g.stroke(); }
  // Hình chính: mỗi kích thước là tổng lò xo → vận tốc liên tục qua mọi lần đổi
  const w = track(t, keysOf(1), kd, dd), h = track(t, keysOf(2), kd, dd), r = track(t, keysOf(3), kd, dd);
  // Bóng tiếp xúc trễ nhẹ sau hình (lệch pha)
  g.fillStyle = 'rgba(31,29,26,0.10)'; roundRect(540, 560 + h * 0.08, w * 0.96, h * 0.9, r); g.fill();
  g.fillStyle = INK; roundRect(540, 540, w, h, r); g.fill();
  // Nội dung: vào sau khi morph bắt đầu, ra trước morph kế tiếp
  g.textAlign = 'center'; g.textBaseline = 'middle';
  let a = (t < 2 * B ? clamp((2 * B - 0.02 - t) / 0.06) : 0) + swapAlpha(t, 10.5 * B, 99);
  g.globalAlpha = clamp(a); g.fillStyle = PAPER; g.font = '600 44px system-ui, sans-serif'; g.fillText('Get started', 540, 540);
  a = swapAlpha(t, 2 * B, 4 * B); g.globalAlpha = a;
  if (a > 0) { g.strokeStyle = ACCENT; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); const s0 = t * 6; g.arc(540, 540, 30, s0, s0 + 4.2); g.stroke(); }
  a = swapAlpha(t, 4 * B, 6 * B); g.globalAlpha = a;
  if (a > 0) { const k = ease(seg(t, 4 * B + 0.08, 4 * B + 0.4)); g.strokeStyle = ACCENT; g.lineWidth = 9; g.beginPath(); g.moveTo(518, 542); g.lineTo(518 + 14 * k, 542 + 16 * k); if (k > .5) g.lineTo(532 + 28 * (k - .5) * 2, 558 - 34 * (k - .5) * 2); g.stroke(); }
  a = swapAlpha(t, 6 * B, 10.5 * B); g.globalAlpha = a;
  if (a > 0) {
    g.fillStyle = '#A9A397'; g.font = '500 30px system-ui'; g.textAlign = 'left'; g.fillText('Renders this week', 320, 450);
    const n = Math.round(1280 * ease(seg(frameT(t, PROJECT.fps), 6 * B + 0.1, 8 * B)));   // số phải đọc được → lượng tử theo khung
    g.fillStyle = PAPER; g.font = '700 96px system-ui'; g.fillText(n.toLocaleString('en-US'), 316, 520);
    for (let i = 0; i < 8; i++) { const hh = (18 + 46 * Math.abs(Math.sin(i * 1.7))) * spring(t - 7 * B - i * 0.05, ...SPRING.snappy); g.fillStyle = i === 7 ? ACCENT : '#4A463F'; g.fillRect(320 + i * 54, 668 - hh, 36, hh); }
    g.textAlign = 'center';
  }
  g.globalAlpha = 1;
  // Con trỏ: đi theo cung tới nút, click đúng phách (scale nhún), rồi rời đi; khung cuối = khung đầu
  const cx = track(t, [[0, 820], [1.3 * B, 600], [3 * B, 600], [4.5 * B, 820]], ...SPRING.default);
  const cy = track(t, [[0, 820], [1.3 * B, 575], [3 * B, 575], [4.5 * B, 820]], ...SPRING.default);
  const press = Math.exp(-40 * Math.max(0, t - 2 * B)) * (t >= 2 * B - 0.06 ? 1 : 0) + (t > 2 * B - 0.06 && t < 2 * B ? 1 : 0);
  const sc = 1 - 0.18 * clamp(press);
  g.save(); g.translate(cx, cy); g.scale(sc, sc);
  g.fillStyle = INK; g.strokeStyle = PAPER; g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 38); g.lineTo(10, 29); g.lineTo(18, 46); g.lineTo(25, 43); g.lineTo(17, 26); g.lineTo(30, 26); g.closePath(); g.fill(); g.stroke();
  g.restore();
  return true;
}
window.seek = seek;
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { seek((performance.now() - t0) / 1000); requestAnimationFrame(loop); })(); }
</script></body></html>
