<!doctype html>
<html><head><meta charset="utf-8"><title>vòng tròn — animatic</title>
<style>
html,body{margin:0;background:#1b1612}canvas{display:block}
</style>
<script src="lib/motion.js"></script></head>
<body><canvas id="c" width="1080" height="1350"></canvas>
<script>
// ANIMATIC (G2) — 7 ảnh tĩnh, tốc độ thật. Bản production thay mỗi ảnh bằng clip image-to-video cùng khung.
// Motif: vòng tròn (ô → hạt chuỗi → cửa sổ tròn → gương) + gió (voan). 80 BPM, 1 ô nhịp = 3 s, 8 ô = 24 s.
const PROJECT = { w: 1080, h: 1350, fps: 30, duration: 24, bpm: 80 };
window.PROJECT = PROJECT;
const { clamp, lerp, seg, ease, easeOut, easeIn, hash } = M;
const W = 1080, H = 1350, BAR = 3;
const g = document.getElementById('c').getContext('2d');
const IW = 1086, IH = 1448;                       // kích thước ảnh gốc

// Camera mỗi shot: tâm (x,y) theo toạ độ ảnh gốc + zoom (1 = vừa phủ khung). a = đầu shot, b = cuối shot.
// Mỗi shot đúng MỘT chuyển động chính (ghi trong docs/shotlist.md).
const SHOTS = [
  { id: 'S1', img: 'p2', t0: 0,  t1: 3,  a: [560, 640, 1.18], b: [520, 600, 1.30] },   // push-in chậm vào mặt nghiêng
  { id: 'S2', img: 'p4', t0: 3,  t1: 6,  a: [543, 760, 1.00], b: [540, 700, 1.12] },   // dolly-in về phía cô bước tới
  { id: 'S3', img: 'p1', t0: 6,  t1: 9,  a: [470, 700, 1.22], b: [600, 690, 1.22] },   // truck trái → phải, lộ ô
  { id: 'S4', img: 'p5', t0: 9,  t1: 12, a: [540, 560, 1.30], b: [540, 600, 1.34] },   // NGHỈ: gần như tĩnh
  { id: 'S5', img: 'p6', t0: 12, t1: 15, a: [560, 960, 1.20], b: [560, 560, 1.20] },   // tilt lên theo ánh mắt
  { id: 'S6', img: 'p7', t0: 15, t1: 18, a: [620, 640, 1.05], b: [885, 365, 3.40] },   // dồn vào cửa sổ tròn
  { id: 'S7', img: 'p3', t0: 18, t1: 24, a: [560, 760, 1.30], b: [560, 820, 1.12] },   // pull-out chậm, kết
];
const WIN = { x: 885, y: 365, r: 126 };           // tâm + bán kính lòng cửa sổ tròn trong p7 (đo từ crop)
const IRIS = [17.55, 18.6];                        // cửa sổ → khung tròn mở ra ảnh gương

const imgs = {};
window.__ready = Promise.all(['p1','p2','p3','p4','p5','p6','p7'].map(k => new Promise(ok => {
  const im = new Image(); im.onload = () => im.decode().then(ok, ok); im.src = `assets/stills/${k}.jpg`; imgs[k] = im;
})));

// Camera: gần tuyến tính cho phần lớn shot; S6 đẩy vào và đậu đúng lòng cửa sổ trước khi iris mở.
function cam(s, t) {
  const k = seg(t, s.t0, s.id === 'S6' ? IRIS[0] : s.t1);
  const e = s.id === 'S6' ? ease(k) : s.id === 'S7' ? easeOut(k) : lerp(k, k * k * (3 - 2 * k), 0.35);   // gần tuyến tính: máy đã trôi sẵn khi vào shot
  return [lerp(s.a[0], s.b[0], e), lerp(s.a[1], s.b[1], e), lerp(s.a[2], s.b[2], e)];
}
// Vẽ ảnh phủ khung: zoom z quanh tâm (cx,cy), kẹp để không lộ mép.
function drawShot(s, t) {
  const [cx0, cy0, z] = cam(s, t);
  const base = Math.max(W / IW, H / IH), sc = base * z;
  const vw = W / sc, vh = H / sc;
  const cx = clamp(cx0, vw / 2, IW - vw / 2), cy = clamp(cy0, vh / 2, IH - vh / 2);
  g.drawImage(imgs[s.img], cx - vw / 2, cy - vh / 2, vw, vh, 0, 0, W, H);
  return { sc, ox: W / 2 - cx * sc, oy: H / 2 - cy * sc };   // ảnh → màn hình: x*sc+ox
}

// Voan organza: tấm vải mờ sát ống kính, mép gợn sóng, nếp sáng mảnh. p = vị trí ngang (0 = phủ giữa).
function veil(p, t, alpha = 1, seed = 1) {
  g.save();
  g.filter = 'blur(14px)';
  for (let L = 0; L < 3; L++) {
    const off = p * W * (1 + L * 0.18) + L * 70, lag = L * 0.06;
    g.beginPath();
    const ph = t * (1.3 + L * 0.4) + seed * 2 + L;
    g.moveTo(off - 260, -60);
    for (let y = -60; y <= H + 60; y += 30) g.lineTo(off - 260 + 70 * Math.sin(y / 210 + ph) + 30 * Math.sin(y / 77 - ph * 1.7), y);
    for (let y = H + 60; y >= -60; y -= 30) g.lineTo(off + 520 + 90 * Math.sin(y / 260 - ph * 0.8 + lag) + 25 * Math.sin(y / 61 + ph), y);
    g.closePath();
    g.fillStyle = `rgba(246,238,224,${(0.34 - L * 0.07) * alpha})`;
    g.fill();
  }
  // nếp sáng
  g.filter = 'blur(5px)';
  g.strokeStyle = `rgba(255,250,240,${0.22 * alpha})`; g.lineWidth = 6;
  for (let i = 0; i < 6; i++) {
    const x0 = p * W + 40 + i * 70 + 20 * Math.sin(seed + i);
    g.beginPath();
    for (let y = -40; y <= H + 40; y += 30) { const x = x0 + 50 * Math.sin(y / (180 + i * 20) + t * 1.5 + i); y < -30 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
  }
  g.restore();
}

// Grade chung: ấm nhẹ, vignette, hạt phim seed theo khung.
const grainCanvas = document.createElement('canvas'); grainCanvas.width = 270; grainCanvas.height = 338;
const gc = grainCanvas.getContext('2d'), gid = gc.createImageData(270, 338);
function grade(t) {
  g.fillStyle = 'rgba(255,196,140,0.05)'; g.globalCompositeOperation = 'soft-light'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
  const v = g.createRadialGradient(W / 2, H * 0.46, H * 0.32, W / 2, H / 2, H * 0.78);
  v.addColorStop(0, 'rgba(20,12,6,0)'); v.addColorStop(1, 'rgba(20,12,6,0.42)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  const f = Math.floor(t * PROJECT.fps + 1e-6);
  for (let i = 0; i < gid.data.length; i += 4) { const n = hash(i * 0.25 + f * 9173) * 255; gid.data[i] = gid.data[i + 1] = gid.data[i + 2] = n; gid.data[i + 3] = 20; }
  gc.putImageData(gid, 0, 0);
  g.save(); g.globalCompositeOperation = 'overlay'; g.imageSmoothingEnabled = true; g.drawImage(grainCanvas, 0, 0, W, H); g.restore();
}

const shotAt = t => SHOTS.find(s => t >= s.t0 && t < s.t1) || SHOTS[SHOTS.length - 1];

function seek(T) {
  const t = clamp(T, 0, PROJECT.duration - 1e-6);
  g.globalAlpha = 1; g.filter = 'none'; g.globalCompositeOperation = 'source-over';
  const s = shotAt(t);

  if (s.id === 'S2' && t < 3.25) {                         // S1 → S2: voan quét qua ống kính, cắt dưới voan
    drawShot(s, t);
  } else if (s.id === 'S3' && t < 6.3) {                  // S2 → S3: hoà 0,3 s, khớp hình chiếc ô
    drawShot(SHOTS[1], 5.999); g.globalAlpha = ease(seg(t, 6, 6.3)); drawShot(s, t); g.globalAlpha = 1;
  } else if (s.id === 'S6' && t >= IRIS[0]) {             // S6 → S7: lòng cửa sổ thành khung tròn mở ra gương
    const m = drawShot(s, t);
    const k = easeIn(seg(t, IRIS[0], IRIS[1]));
    const R = WIN.r * m.sc * lerp(0.98, 1, k);
    g.save(); g.beginPath(); g.arc(WIN.x * m.sc + m.ox, WIN.y * m.sc + m.oy, R, 0, 7); g.clip();
    g.globalAlpha = ease(seg(t, IRIS[0], IRIS[0] + 0.25)); drawShot(SHOTS[6], 18); g.restore(); g.globalAlpha = 1;
  } else if (s.id === 'S7' && t < IRIS[1]) {              // vòng tròn tiếp tục nở cho tới khi phủ khung
    const m = drawShot(SHOTS[5], 17.999);
    const k = ease(seg(t, 18, IRIS[1]));
    const R = lerp(WIN.r * m.sc, Math.hypot(W, H) * 0.62, k);
    g.save(); g.beginPath(); g.arc(WIN.x * m.sc + m.ox, WIN.y * m.sc + m.oy, R, 0, 7); g.clip(); drawShot(s, t); g.restore();
  } else {
    drawShot(s, t);
  }

  // Voan: mở phim (đã phủ ở khung 0, trôi ra) và lần quét S1→S2.
  if (t < 1.8) veil(lerp(-0.05, -1.25, easeIn(seg(t, 0, 1.8)) * 0.7 + seg(t, 0, 1.8) * 0.3), t, 1, 1);
  if (t > 2.55 && t < 3.6) veil(lerp(1.15, -1.4, ease(seg(t, 2.55, 3.6))), t, 2.2, 3);

  grade(t);

  // Không có chữ trên phim (chủ phim chốt 30/10/2026).
  return true;
}
window.seek = seek;
if (!navigator.webdriver) window.__ready.then(() => { const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % PROJECT.duration); requestAnimationFrame(loop); })(); });
</script></body></html>
